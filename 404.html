<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
    const path = window.location.pathname;
    if (path.startsWith('/prodotto/')) {
        const nomeProdotto = path.replace('/prodotto/', '');
        // Usiamo un parametro di ricerca invece dell'hash, è più pulito
        window.location.href = '/?prodotto=' + nomeProdotto;
    } else {
        window.location.href = '/';
    }
</script>
</head>
<body>
    <p>Caricamento in corso...</p>
</body>
</html>
