<!DOCTYPE html>
<html>
<head>
    <script>
        const path = window.location.pathname;
        if (path.startsWith('/prodotto/')) {
            const nomeProdotto = path.replace('/prodotto/', '');
            // Salva il nome del prodotto nella memoria del browser prima di uscire
            localStorage.setItem('prodottoDaAprire', nomeProdotto);
            window.location.href = '/';
        } else {
            window.location.href = '/';
        }
    </script>
</head>
<body></body>
</html>
